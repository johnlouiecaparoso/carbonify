# Carbonify SPA — nginx site config (used by the Docker image).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are immutable — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA history fallback: every unknown path serves index.html so the Vue
  # router can resolve it client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Don't cache the entry document, so a new deploy is picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
