name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Non-mutating lint check (the `lint` script uses --fix, which is for local
      # use only). Required: the tree is at zero lint errors, so any new
      # violation fails the build.
      - name: Run linting
        run: npm run lint:check

      - name: Run unit tests
        run: npm run test:run

  e2e:
    runs-on: ubuntu-latest
    # E2E needs Playwright browsers and a live backend (Supabase + dev server).
    # Kept separate and non-blocking until that environment is wired in CI.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/

  lighthouse:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # lhci serves `staticDistDir` (see lighthouserc.json), so dist/ has to
      # exist in THIS job. It did not: the job checked out, installed and ran
      # lhci against a tree with no build in it. The `build` job's artifact is
      # never downloaded here, so `needs: build` bought ordering and nothing else.
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/

  # ── There is deliberately no `deploy` job here ────────────────────────────
  #
  # One existed and had NEVER run. It called amondnet/vercel-action with
  # VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID, none of which have ever
  # been set as repository secrets, so every push to `main` failed on:
  #
  #     Input required and not supplied: vercel-token
  #
  # Deploys come from the **Vercel GitHub integration**, which is why
  # production has always updated despite a red X on `main`. That red X was
  # the real cost: a CI status that is permanently failing for a reason nobody
  # needs to act on trains everyone to stop reading it — and then a genuine
  # failure looks identical.
  #
  # Removed rather than fixed, on purpose. Setting the secrets would deploy
  # TWICE per push (integration + action), and VERCEL_PROJECT_ID would need
  # updating by hand whenever the Vercel project changes — a second place for
  # the deployment target to drift out of sync. One deploy path is the point.
  #
  # If CI should ever own deployment instead, delete the Git integration
  # first, then add the job back. Never both.
  # See docs/VERCEL_DOMAIN_AND_REDEPLOY.md.








